name: EDT Market Shorts Production Pipeline

permissions:
  contents: read

concurrency:
  group: edt-market-shorts-production
  cancel-in-progress: false

on:
  schedule:
    # 정각 예약은 GitHub 스케줄러 혼잡으로 크게 지연된다 (10/22~10/28 실제 시작 05~06시 UTC)
    - cron: '17 1 * * *' # 매일 KST 오전 10시 17분 (UTC 01:17)
    # DN2026_0113: 예비 예약. 본 예약이 GitHub 에서 누락된 날(11-10)만 대신 실행하고,
    # 오늘 발행·슬롯 흔적이 있으면 스스로 스킵한다(실패 회차 재시도 아님). 미국 D-1일 휴장이면 둘 다 스킵.
    - cron: '47 9 * * *' # 매일 KST 18시 47분 (UTC 09:47)
  workflow_dispatch:
    inputs:
      mode:
        description: '파일럿=저비용 이미지 1장+음성 1개, full=EDT 단독 즉시 공개 발행'
        required: true
        type: choice
        default: daily-video-pilot
        options:
          - video-pilot
          - goc-video-pilot
          - daily-video-pilot
          - production-video-pilot
          - full
      caption_policy:
        description: '자막 정책: 실영상 검수 전에는 legacy-v1 유지'
        type: choice
        default: legacy-v1
        options:
          - legacy-v1
          - caption-layout-v1

jobs:
  build-and-upload:
    # ubuntu-latest 는 2026-10-19부터 Ubuntu 26 으로 이전된다. 폰트/FFmpeg 검증 전까지 고정한다
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPERATIONAL_SAFETY_ENABLED: ${{ vars.OPERATIONAL_SAFETY_ENABLED || 'true' }}
      PIPELINE_CHANNEL_KEY: ${{ vars.PIPELINE_CHANNEL_KEY || 'EDT_UNIVERSE_INVEST_AREA99' }}
      UPLOAD_SESSION_FERNET_KEY: ${{ secrets.UPLOAD_SESSION_FERNET_KEY }}
      # DN2026_0088: 수동 = inputs.caption_policy, 예약 = vars.CAPTION_LAYOUT_POLICY, 둘 다 없으면 legacy-v1.
      # caption-layout-v1 전환은 production-video-pilot 실영상 검수(회장) 후 Variable로만 한다.
      CAPTION_LAYOUT_POLICY: ${{ (github.event_name == 'workflow_dispatch' && inputs.caption_policy) || vars.CAPTION_LAYOUT_POLICY || 'legacy-v1' }}
      # DN2026_0113: 예비 cron 으로 발화한 실행만 backup. 수동·본 예약은 primary.
      PIPELINE_SCHEDULE_ROLE: ${{ github.event_name == 'schedule' && github.event.schedule == '47 9 * * *' && 'backup' || 'primary' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' # 3.10에서 3.12로 수정
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-nanum
          fc-cache -f

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install reviewed caption font
        if: env.CAPTION_LAYOUT_POLICY == 'caption-layout-v1'  # 예약 실행 Variable 경로도 폰트 설치(DN2026_0088)
        run: sudo python3 scripts/install_caption_font.py

      - name: Run production-path video pilot
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'video-pilot' || inputs.mode == 'daily-video-pilot' || inputs.mode == 'goc-video-pilot' || inputs.mode == 'production-video-pilot')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LOG_DIR: logs
          ARTIFACT_DIR: artifacts
        run: |
          export PYTHONPATH=$(pwd)
          python main.py --${{ inputs.mode }}

      - name: Run full orchestrator
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LOG_DIR: logs
          YOUTUBE_DEFAULT_PRIVACY: public
        run: |
          export PYTHONPATH=$(pwd)
          python main.py --run-today

      # 실패 로그는 로그인해야 보이지만 annotation 과 summary 는 공개된다.
      # 중단 사유를 여기로 올려 'exit code 1' 만 보이는 상황을 없앤다.
      - name: Report pipeline outcome
        if: always()
        run: python3 scripts/report_pipeline_outcome.py logs/pipeline.log

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            artifacts/
            output_short.mp4
          if-no-files-found: warn
          retention-days: 14
