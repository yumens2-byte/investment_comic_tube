name: EDT Market Shorts Production Pipeline

permissions:
  contents: read

concurrency:
  group: edt-market-shorts-production
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 1 * * *' # 매일 KST 오전 10시 (UTC 01:00)
  workflow_dispatch:
    inputs:
      mode:
        description: '파일럿=저비용 이미지 1장+음성 1개, full=EDT 단독 즉시 공개 발행'
        required: true
        type: choice
        default: daily-video-pilot
        options:
          - video-pilot
          - goc-video-pilot
          - daily-video-pilot
          - full

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPERATIONAL_SAFETY_ENABLED: ${{ vars.OPERATIONAL_SAFETY_ENABLED || 'true' }}
      PIPELINE_CHANNEL_KEY: ${{ vars.PIPELINE_CHANNEL_KEY || 'EDT_UNIVERSE_INVEST_AREA99' }}
      UPLOAD_SESSION_FERNET_KEY: ${{ secrets.UPLOAD_SESSION_FERNET_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 3.10에서 3.12로 수정
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-nanum
          fc-cache -f

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run production-path video pilot
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'video-pilot' || inputs.mode == 'daily-video-pilot' || inputs.mode == 'goc-video-pilot')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LOG_DIR: logs
          ARTIFACT_DIR: artifacts
        run: |
          export PYTHONPATH=$(pwd)
          python main.py --${{ inputs.mode }}

      - name: Run full orchestrator
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LOG_DIR: logs
          YOUTUBE_DEFAULT_PRIVACY: public
        run: |
          export PYTHONPATH=$(pwd)
          python main.py

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            artifacts/
            output_short.mp4
          if-no-files-found: warn
          retention-days: 14
