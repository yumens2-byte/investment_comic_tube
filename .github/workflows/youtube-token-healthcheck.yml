# YouTube refresh token 유효성 사전 점검
#
# 배치 위치: .github/workflows/youtube-token-healthcheck.yml
# 스크립트 : scripts/check_youtube_token.py
#
# 목적
#   발행 파이프라인이 죽기 전에 토큰 만료를 미리 감지한다.
#   발행(09:00 KST)보다 앞선 시각에 돌려 조치 시간을 확보한다.
#
# ⚠️ 확인 필요
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET Secret 명칭은 미확인 추정값이다.
#   src/publisher.py 의 환경변수 조회 키와 대조 후 수정할 것.

name: youtube-token-healthcheck

"on":
  schedule:
    # 정각/반각 혼잡 회피를 위해 :37 사용 (사내 운영 규약)
    # UTC 22:37 = KST 07:37 — 발행(09:00 KST)보다 약 1시간 20분 선행
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-token-healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # step 의 if 조건에서는 해당 step 자신의 env 와 secrets 컨텍스트를 참조할 수 없다.
    # 따라서 Telegram 설정 여부 판별용 값은 job 레벨 env 로 올려둔다.
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir google-auth

      - name: Check refresh token
        id: check
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/check_youtube_token.py

      # 일시 오류(exit 3)는 1회 재시도한다. 토큰 사망(exit 1)은 재시도하지 않는다.
      - name: Retry once on transient error
        id: retry
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          sleep 30
          python scripts/check_youtube_token.py

      # Telegram Secret 이 없으면 이 스텝은 자동 스킵된다(설정 강제 아님).
      - name: Notify Telegram on failure
        if: steps.retry.outcome == 'failure' && env.TG_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=[investment_comic_tube] YouTube refresh token 점검 실패. 재인증 및 YOUTUBE_REFRESH_TOKEN Secret 교체 필요. ${RUN_URL}"

      # 최종 판정. Telegram 미설정이어도 이 스텝 실패로 GitHub 기본 알림 메일이 발송된다.
      - name: Fail job if token is invalid
        if: steps.retry.outcome == 'failure'
        run: |
          echo "::error title=YouTube token invalid::refresh token 재발급 및 Secret 교체가 필요합니다."
          exit 1
