# YouTube refresh token 유효성 사전 점검
#
# 배치 위치: .github/workflows/youtube-token-healthcheck.yml
# 스크립트 : scripts/check_youtube_token.py
# VERSION  : 1.1.0
#
# v1.1.0 변경
#   - requests 의존성 추가. google-auth 는 transport 를 선택적 의존성으로 둔다.
#   - continue-on-error/outcome 방식을 종료 코드 분기로 교체.
#     이전 구조는 의존성 오류·설정 오류를 전부 "토큰 무효"로 오진했다.
#
# 종료 코드 계약 (scripts/check_youtube_token.py)
#   0 정상 / 1 토큰 만료·폐기 / 2 설정 오류 / 3 일시 오류(재시도)

name: youtube-token-healthcheck

"on":
  schedule:
    # UTC 22:37 = KST 07:37 — 발행(KST 09:00)보다 선행
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-token-healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # step 의 if 에서는 자신의 env 와 secrets 컨텍스트를 참조할 수 없으므로
    # Telegram 설정 여부 판별용 값은 job 레벨로 올린다.
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # google-auth 만 설치하면 google.auth.transport.requests 가
        # ModuleNotFoundError: requests 로 죽는다. transport extra 를 함께 설치한다.
        run: pip install --no-cache-dir "google-auth[requests]"

      - name: Check refresh token
        id: check
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          python scripts/check_youtube_token.py
          rc=$?

          # 일시 오류(3)만 1회 재시도. 토큰 사망(1)·설정 오류(2)는 재시도해도 결과가 같다.
          if [ "$rc" -eq 3 ]; then
            echo "--- transient error, retry in 30s ---"
            sleep 30
            python scripts/check_youtube_token.py
            rc=$?
          fi
          set -e

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "점검 종료 코드: $rc"

      - name: Notify Telegram on failure
        if: steps.check.outputs.rc != '0' && env.TG_TOKEN != ''
        env:
          RC: ${{ steps.check.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RC" in
            1) MSG="YouTube refresh token 만료/폐기. 재인증 후 Secret 교체 필요." ;;
            2) MSG="점검 설정 오류(환경변수 누락 등). Secret 배선 확인 필요." ;;
            *) MSG="점검 실패(rc=$RC). 실행 로그 확인 필요." ;;
          esac
          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=[investment_comic_tube] ${MSG} ${RUN_URL}"

      - name: Report result
        if: always()
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: |
          case "$RC" in
            0)
              echo "::notice title=YouTube token OK::refresh token 정상입니다."
              exit 0
              ;;
            1)
              echo "::error title=Token expired or revoked::재인증 후 YOUTUBE_REFRESH_TOKEN 교체가 필요합니다."
              exit 1
              ;;
            2)
              echo "::error title=Config error::환경변수/Secret 배선 문제입니다. 토큰 문제가 아닙니다."
              exit 1
              ;;
            3)
              echo "::error title=Transient error::네트워크 등 일시 오류입니다. 재실행하십시오."
              exit 1
              ;;
            *)
              echo "::error title=Check step aborted::스크립트가 계약된 종료 코드를 반환하지 못했습니다(의존성/문법 오류 가능). 로그를 확인하십시오."
              exit 1
              ;;
          esac
